name: Release wisp
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test, build and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/build.ps1 -Version $env:RELEASE_TAG.TrimStart('v') -ReleaseBaseUrl "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$env:RELEASE_TAG"
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:RELEASE_TAG dist/*.zip dist/install.ps1 dist/SHA256SUMS dist/release.json --title "wisp $env:RELEASE_TAG" --notes-file $notes
          } else {
            gh release create $env:RELEASE_TAG dist/*.zip dist/install.ps1 dist/SHA256SUMS dist/release.json --title "wisp $env:RELEASE_TAG" --generate-notes
          }
